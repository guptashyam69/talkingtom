<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Talking Tom – Interactive Talking Cat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <!-- Room Background -->
        <div class="room-background">
            <div class="wall">
                <div class="wallpaper-pattern"></div>
                <div class="wall-window">
                    <div class="window-cross-h"></div>
                    <div class="window-cross-v"></div>
                    <div class="window-moon"></div>
                </div>
            </div>
            <div class="floor"></div>
            <div class="carpet"></div>
        </div>

        <!-- Header -->
        <header class="header-bar">
            <div class="title-container">
                <span class="app-logo">🐱</span>
                <h1>Talking Tom</h1>
            </div>
            <div id="statusPill" class="status-pill idle">
                <span class="status-dot"></span>
                <span id="statusText">Idle</span>
            </div>
            <button id="settingsToggleBtn" class="settings-toggle-btn" title="Settings">⚙️</button>
        </header>

        <!-- Settings -->
        <div id="settingsPanel" class="settings-panel">
            <div class="settings-title">
                <span>Settings</span>
                <button id="closeSettingsBtn" class="close-settings-btn">✕</button>
            </div>
            <div class="setting-group">
                <label for="pitchSlider">
                    <span>Voice Pitch</span>
                    <span id="pitchVal">1.20x</span>
                </label>
                <input type="range" id="pitchSlider" min="1.05" max="1.60" step="0.05" value="1.20">
            </div>
            <div class="setting-group">
                <label for="sensitivitySlider">
                    <span>Mic Sensitivity</span>
                    <span id="sensitivityVal">0.025</span>
                </label>
                <input type="range" id="sensitivitySlider" min="0.010" max="0.080" step="0.005" value="0.025">
            </div>
        </div>

        <!-- Tom Canvas -->
        <main class="canvas-wrapper">
            <canvas id="tomCanvas" width="500" height="620"></canvas>
            <div class="volume-meter-wrapper" title="Mic Level">
                <div id="volumeMeterBar" class="volume-meter-bar"></div>
            </div>
        </main>

        <!-- Action Bar -->
        <nav class="bottom-bar">
            <button id="milkBtn" class="action-btn" title="Feed Milk">
                <span class="btn-icon">🥛</span>
                <span class="btn-label">Feed</span>
            </button>
            <button id="fartBtn" class="action-btn" title="Fart">
                <span class="btn-icon">💨</span>
                <span class="btn-label">Fart</span>
            </button>
            <button id="micBtn" class="action-btn mic-btn" title="Toggle Mic">
                <span class="btn-icon">🎤</span>
                <span class="btn-label">Listen</span>
            </button>
            <button id="slapBtn" class="action-btn" title="Slap">
                <span class="btn-icon">👋</span>
                <span class="btn-label">Slap</span>
            </button>
            <button id="petBtn" class="action-btn" title="Pet">
                <span class="btn-icon">🐾</span>
                <span class="btn-label">Pet</span>
            </button>
        </nav>

        <!-- Start Modal -->
        <div id="startModal" class="modal-overlay">
            <div class="modal-card">
                <div class="modal-icon">🐱🎤</div>
                <h2>Meet Talking Tom!</h2>
                <p>Speak into your microphone and Tom will listen, then repeat what you said in his cute high-pitched voice!</p>
                <p>You can also poke his head, belly, feet, feed him, slap, fart, or pet him!</p>
                <button id="startAppBtn" class="start-btn">Start Playing!</button>
            </div>
        </div>
    </div>

    <script src="audio.js"></script>
    <script src="tom.js"></script>
    <script src="app.js"></script>
</body>
</html>
